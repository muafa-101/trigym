<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TRIGYM</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body class="relative font-sans text-ink bg-sky min-h-screen flex items-center justify-center p-4 sm:p-6 overflow-hidden leading-relaxed antialiased">

    <!-- Dekorasi latar -->
    <span class="pointer-events-none absolute -left-24 -top-24 size-72 rounded-full bg-pink sm:size-96" aria-hidden="true"></span>
    <span class="pointer-events-none absolute -bottom-20 -right-16 size-64 rounded-full bg-coral" aria-hidden="true"></span>
    <span class="pointer-events-none absolute bottom-10 left-6 hidden size-28 text-pink sm:block bg-[repeating-linear-gradient(135deg,currentColor_0_2px,transparent_2px_8px)]" aria-hidden="true"></span>

    <main class="relative w-full max-w-md rounded-custom bg-white p-6 shadow-custom sm:p-10">
        <a href="struktur.html" class="mb-6 block"><img src="assets/logo.png" alt="TriGym" class="mx-auto h-9 w-auto"></a>
        <h1 class="text-center text-2xl font-extrabold tracking-tight text-pink">Selamat datang kembali!</h1>
        <p class="mt-1 text-center text-sm text-muted">Masuk untuk melanjutkan sesi latihanmu.</p>

        <form action="#" method="POST" class="mt-8 space-y-4">
                <div class="relative">
                    <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required  class="peer w-full rounded-full border-2 border-slate-200 bg-white px-5 pb-2 pt-6 text-sm text-ink placeholder:text-transparent transition-colors focus:border-pink focus:outline-none">
                    <label for="email" class="pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-sm text-muted transition-all peer-focus:top-3 peer-focus:translate-y-0 peer-focus:text-[11px] peer-focus:text-pink peer-[:not(:placeholder-shown)]:top-3 peer-[:not(:placeholder-shown)]:translate-y-0 peer-[:not(:placeholder-shown)]:text-[11px]">Email</label>
                </div>
                <div class="relative">
                    <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required minlength="8" class="peer w-full rounded-full pr-12 border-2 border-slate-200 bg-white px-5 pb-2 pt-6 text-sm text-ink placeholder:text-transparent transition-colors focus:border-pink focus:outline-none">
                    <label for="password" class="pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-sm text-muted transition-all peer-focus:top-3 peer-focus:translate-y-0 peer-focus:text-[11px] peer-focus:text-pink peer-[:not(:placeholder-shown)]:top-3 peer-[:not(:placeholder-shown)]:translate-y-0 peer-[:not(:placeholder-shown)]:text-[11px]">Password</label>
                    <button type="button" data-toggle="password" aria-label="Tampilkan password" class="cursor-pointer absolute inset-y-0 right-0 grid w-12 place-items-center rounded-full text-muted hover:text-pink focus-visible:outline-2 focus-visible:outline-pink">
                        <svg data-eye="on" xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg data-eye="off" xmlns="http://www.w3.org/2000/svg" class="hidden size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 5.2A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg>
                    </button>
                </div>
            <div class="flex items-center justify-between text-sm">
                <label class="flex cursor-pointer items-center gap-2 text-muted"><input type="checkbox" name="remember" class="size-4 rounded border-slate-300 accent-pink">Ingat saya</label>
                <a href="#" class="font-semibold text-pink hover:underline">Lupa password?</a>
            </div>
            <button type="submit" class="cursor-pointer w-full rounded-full px-4 py-3.5 font-bold text-white shadow-md transition-all duration-200 hover:-translate-y-0.5 focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-pink bg-ink hover:bg-pink">Masuk</button>
        </form>

        <div class="my-6 flex items-center gap-3 text-xs text-muted">
            <span class="h-px flex-1 bg-slate-200"></span>atau<span class="h-px flex-1 bg-slate-200"></span>
        </div>

        <button type="button" class="cursor-pointer flex w-full items-center justify-center gap-3 rounded-full border-2 border-slate-200 px-4 py-3 text-sm font-bold transition-colors hover:border-ink focus-visible:outline-2 focus-visible:outline-pink">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.56-5.17 3.56-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3a7.2 7.2 0 0 1-10.7-3.77H1.34v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.36 14.32a7.2 7.2 0 0 1 0-4.64v-3.1H1.34a12 12 0 0 0 0 10.84l4.02-3.1z"/><path fill="#EA4335" d="M12 4.77c1.76 0 3.34.6 4.59 1.8l3.44-3.44A11.5 11.5 0 0 0 12 0 12 12 0 0 0 1.34 6.58l4.02 3.1A7.2 7.2 0 0 1 12 4.77z"/></svg>
            Masuk dengan Google
        </button>

        <p class="mt-6 text-center text-sm text-muted">Belum punya akun? <a href="signup.html" class="font-bold text-pink hover:underline">Daftar</a></p>
    </main>

    <script>
        document.querySelectorAll("[data-toggle]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                var input = document.getElementById(btn.dataset.toggle);
                var show = input.type === "password";
                input.type = show ? "text" : "password";
                btn.querySelector('[data-eye="on"]').classList.toggle("hidden", show);
                btn.querySelector('[data-eye="off"]').classList.toggle("hidden", !show);
            });
        });
    </script>
</body>
</html>
